<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
  <link rel="stylesheet" href="style.css">
    <title>FLOW AI | Hip Hop Guide</title>

    <img src="Flow.png" class="mascote" alt="Mascote Flow AI">
</head>


<body>


    <!-- ==========================================
         FUNDO STREET NEON
    =========================================== -->

    <div class="background">


        <!-- ======================================
             CONTAINER PRINCIPAL
        ======================================= -->

        <div class="container">


            <!-- ==================================
                 PAINEL ESQUERDO
            =================================== -->

            <div class="left-panel">


                <!-- Brilho atrás do mascote -->

                <div class="glow"></div>


                <!-- Mascote -->

                <img
                    src="Flow.png"
                    class="mascote"
                    alt="Mascote Flow AI"
                >


                <!-- Logo -->

                <h1>FLOW AI</h1>


                <!-- Subtítulo -->

                <p class="subtitle">
                    HIP HOP GUIDE
                </p>


                <!-- Status -->

                <div class="status">

                    <span class="online"></span>

                    ONLINE

                </div>


                <!-- Ícones -->

                <div class="icons">

                    <span>🎤</span>
                    <span>🎧</span>
                    <span>🎨</span>
                    <span>🎵</span>

                </div>


            </div>



            <!-- ==================================
                 PAINEL DIREITO
            =================================== -->

            <div class="right-panel">


                <!-- Cabeçalho -->

                <div class="header">

                    <h2>
                        FLOW AI
                    </h2>

                    <p>
                        Pergunte qualquer coisa sobre Hip Hop.
                    </p>

                </div>



                <!-- ==================================
                     CHAT
                =================================== -->

                <div
                    id="chatBox"
                    class="chat"
                >


                    <!-- Mensagem inicial -->

                    <div class="message ai">

                        👋 Olá!

                        <br><br>

                        Sou a <strong>FLOW AI</strong>.

                        <br><br>

                        Pergunte qualquer coisa sobre
                        Hip Hop, Rap ou Eminem.

                    </div>


                </div>



                <!-- ==================================
                     ÁREA DE PERGUNTA
                =================================== -->

                <div class="input-area">


                    <input
                        type="text"
                        id="pergunta"
                        placeholder="Digite sua pergunta..."
                        autocomplete="off"
                    >


                    <button
                        id="enviar"
                        type="button"
                    >

                        ENVIAR

                    </button>


                </div>


            </div>


        </div>


    </div>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>


</body>

</html>
